# Style policy applies to new code and incrementally migrated modules.
# Bulk reformatting historical files would invalidate dataset and SHA-256 snapshots.
[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = ["BD/projects", "NN/nn_results_*", "NN/diagnostics/evaluation_*"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = []

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
line-ending = "lf"
